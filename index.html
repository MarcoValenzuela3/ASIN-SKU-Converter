<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASIN ↔ SKU Converter</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }
  th {
    background: #f4f4f4;
  }
  button {
    margin-right: 5px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h2>ASIN ↔ SKU Converter</h2>

<input
  id="search"
  placeholder="Enter ASIN, SKU, or keyword (multiple allowed)"
  autofocus
>

<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>ASIN</th>
      <th>SKU</th>
      <th>Amazon</th>
      <th>Copy</th>
    </tr>
  </thead>
  <tbody id="results"></tbody>
</table>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwdhEe8xMtOnullDBu-EkgFHSsaswmVu6YKL6NY-gy9PGXrrbOxj8AwEZ0W5OdiZXza/exec";

const input = document.getElementById("search");
const tbody = document.getElementById("results");

input.addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

function runSearch() {
  const q = input.value.trim();
  if (!q) return;

  fetch(API_URL + "?q=" + encodeURIComponent(q))
    .then(res => res.json())
    .then(showResults)
    .catch(err => {
      console.error(err);
      alert("Search failed. Check console.");
    });
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Copied: " + text);
}

function showResults(data) {
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML =
      "<tr><td colspan='5'>No results found</td></tr>";
    return;
  }

  data.forEach(item => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${item.product}</td>
      <td>${item.asin}</td>
      <td>${item.sku}</td>
      <td>
        <a href="${item.amazon}" target="_blank">
          View on Amazon
        </a>
      </td>
      <td>
        <button onclick="copyText('${item.asin}')">Copy ASIN</button>
        <button onclick="copyText('${item.sku}')">Copy SKU</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
