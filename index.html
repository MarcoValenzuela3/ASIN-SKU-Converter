<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASIN ↔ SKU Converter</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  h2 {
    margin-bottom: 10px;
  }

  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  .search-bar input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
  }

  .search-bar button {
    padding: 12px 16px;
    font-size: 16px;
    cursor: pointer;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }

  th {
    background: #f4f4f4;
  }

  .clickable {
    color: blue;
    cursor: pointer;
    text-decoration: underline;
  }

  button.copy {
    margin-right: 5px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h2>ASIN ↔ SKU Converter</h2>

<div class="search-bar">
  <input
    id="search"
    placeholder="Enter ASIN, SKU, or keyword (space or comma separated)"
    autofocus
  >
  <button onclick="runSearch()">Search</button>
</div>

<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>ASIN</th>
      <th>SKU</th>
      <th>Amazon</th>
      <th>Copy</th>
    </tr>
  </thead>
  <tbody id="results"></tbody>
</table>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwdhEe8xMtOnullDBu-EkgFHSsaswmVu6YKL6NY-gy9PGXrrbOxj8AwEZ0W5OdiZXza/exec";

const input = document.getElementById("search");
const tbody = document.getElementById("results");

// Press Enter to search
input.addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

// Clear results when input is cleared
input.addEventListener("input", () => {
  if (!input.value.trim()) tbody.innerHTML = "";
});

function runSearch() {
  const q = input.value.trim();
  if (!q) return;

  fetch(API_URL + "?q=" + encodeURIComponent(q))
    .then(res => res.json())
    .then(showResults)
    .catch(err => {
      console.error(err);
      alert("Error loading results");
    });
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Copied: " + text);
}

function selectValue(value) {
  input.value = value;
  input.focus();
}

function showResults(data) {
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML =
      "<tr><td colspan='5'>No results found</td></tr>";
    return;
  }

  data.forEach(item => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${item.product}</td>
      <td>
        <span class="clickable" onclick="selectValue('${item.asin}')">
          ${item.asin}
        </span>
      </td>
      <td>
        <span class="clickable" onclick="selectValue('${item.sku}')">
          ${item.sku}
        </span>
      </td>
      <td>
        <a href="${item.amazon}" target="_blank">
          View on Amazon
        </a>
      </td>
      <td>
        <button class="copy" onclick="copyText('${item.asin}')">
          Copy ASIN
        </button>
        <button class="copy" onclick="copyText('${item.sku}')">
          Copy SKU
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
