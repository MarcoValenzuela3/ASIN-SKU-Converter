<!DOCTYPE html>
<html>
<head>
  <title>ASIN / SKU Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
    }

    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }

    th {
      background: #f4f4f4;
    }

    .copy-btn {
      font-size: 12px;
      margin-left: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>ASIN / SKU Converter</h2>

<p>
Enter one or more ASINs, SKUs, or keywords.<br>
You can separate them with commas or new lines.
</p>

<textarea id="query" placeholder="B08XXXXXXX
SKU-123
keyword"></textarea>

<br>
<button onclick="search()">Search</button>

<table id="results"></table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUjiWD0t27DHE1V-BXlON5yNnaZunFM4C0BO3OaAhB4-E68fbJK1tHhgxpHTGXxqAs/exec";

function copyText(text) {
  navigator.clipboard.writeText(text);
}

function search() {
  const q = document.getElementById("query").value;

  fetch(`${SCRIPT_URL}?q=${encodeURIComponent(q)}`)
    .then(res => res.json())
    .then(data => {
      let html = `
        <tr>
          <th>Product</th>
          <th>ASIN</th>
          <th>SKU</th>
        </tr>
      `;

      if (!data.results.length) {
        html += `
          <tr>
            <td colspan="3">No results found</td>
          </tr>
        `;
      } else {
        data.results.forEach(r => {
          html += `
            <tr>
              <td>${r.product || ""}</td>
              <td>
                ${r.asin || ""}
                <button class="copy-btn" onclick="copyText('${r.asin}')">Copy</button>
              </td>
              <td>
                ${r.sku || ""}
                <button class="copy-btn" onclick="copyText('${r.sku}')">Copy</button>
              </td>
            </tr>
          `;
        });
      }

      document.getElementById("results").innerHTML = html;
    });
}
</script>

</body>
</html>
