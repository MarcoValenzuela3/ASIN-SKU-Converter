<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASIN / SKU Converter</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  padding: 40px;
}

.container {
  max-width: 1200px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
}

h1 {
  text-align: center;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-top: 20px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  font-size: 18px;
  background: #4a90e2;
  color: white;
  border: none;
  cursor: pointer;
}

table {
  width: 100%;
  margin-top: 30px;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  vertical-align: middle;
}

img {
  width: 80px;
  border-radius: 6px;
}

.open-btn {
  background: #4a90e2;
  color: white;
  padding: 6px 12px;
  text-decoration: none;
  border-radius: 4px;
}
</style>
</head>

<body>
<div class="container">
  <h1>ASIN / SKU Converter</h1>

  <input id="searchInput" placeholder="Search ASIN, SKU, or keyword">
  <button onclick="search()">Search</button>

  <div id="results"></div>
</div>

<script>
const SCRIPT_URL = "PASTE_SCRIPT_URL_HERE";

function search() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;

  fetch(`${SCRIPT_URL}?q=${encodeURIComponent(q)}`)
    .then(r => r.json())
    .then(d => render(d.results))
    .catch(() => {
      document.getElementById("results").innerHTML = "Error loading data";
    });
}

function render(items) {
  if (!items.length) {
    document.getElementById("results").innerHTML = "No results found";
    return;
  }

  let html = `
    <table>
      <tr>
        <th>Image</th>
        <th>Product</th>
        <th>ASIN</th>
        <th>SKU</th>
        <th>Amazon</th>
      </tr>
  `;

  items.forEach(i => {
    const imgPath = i.image
      ? `images/${i.image}`
      : "";

    const amazon = i.asin
      ? `https://www.amazon.com/dp/${i.asin}`
      : "#";

    html += `
      <tr>
        <td>${imgPath ? `<img src="${imgPath}">` : ""}</td>
        <td>${i.product || ""}</td>
        <td>${i.asin || ""}</td>
        <td>${i.sku || ""}</td>
        <td><a class="open-btn" href="${amazon}" target="_blank">Open</a></td>
      </tr>
    `;
  });

  html += "</table>";
  document.getElementById("results").innerHTML = html;
}
</script>
</body>
</html>
